<title>大智度論過招場</title>
<meta name="description" content="《大智度論》卷一導讀影片複習遊戲（第一品僧叡釋論序、第二品歸敬偈、第三品大因緣、第四品四悉檀）：問題鏈排序、疑者出招你來接、難句白話、原文填空、關鍵提醒、配對快打。原典與白話依大智度論讀本逐字照錄。">

<style>
/* 版式：門頁「大智度論導讀影片」暖金褐框景的延伸——褐墨底、金線、朱印金框、米色原典；單一深色（與門頁一致，刻意不做淺色） */
:root{
  --ink-0:#1d1711; --ink-1:#241d16; --ink-2:#2c241c; --ink-3:#382e25; --ink-4:#46382b;
  --line:rgba(217,184,124,.24); --line-2:rgba(217,184,124,.5);
  --gold:#e3c085; --amber:#d9b87c; --gsoft:#c9a96e; --text:#f5e4cd; --mute:#c3b39a; --cream:#fbefdc;
  --seal:#a8402b; --seal-ink:#fbe9dc;
  --gold-line:rgba(227,192,133,.55); --gold-wash:rgba(227,192,133,.08);
  --ok:#a5d6ae; --ok-bg:rgba(165,214,174,.12); --bad:#f0a084; --bad-bg:rgba(240,160,132,.13);
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-latin:"Cormorant Garamond","Times New Roman",serif;
  --r:12px; color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--ink-1)}
body{margin:0;background:radial-gradient(80% 50% at 50% 0%,rgba(227,192,133,.12),transparent 70%),var(--ink-1);color:var(--text);font-family:var(--f-body);font-size:18px;line-height:1.75;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
a{color:var(--gold)}
.wrap{position:relative;max-width:960px;margin:0 auto;padding-inline:16px;padding-block:28px 64px}
.frame{position:relative;border:1px solid var(--line-2);border-radius:22px;padding:34px 30px 30px;background:linear-gradient(180deg,rgba(70,56,43,.62),rgba(44,36,28,.55));box-shadow:0 0 0 1px rgba(217,184,124,.08),0 34px 70px -34px rgba(0,0,0,.8);overflow:hidden}
.frame::after{content:"";position:absolute;inset:9px;border:1px solid rgba(217,184,124,.12);border-radius:16px;pointer-events:none}
.frame::before{content:"智";position:absolute;right:-26px;top:-60px;font-family:var(--f-display);font-size:300px;font-weight:900;line-height:1;color:rgba(227,192,133,.05);pointer-events:none}
@media (max-width:640px){.frame{padding:24px 14px 20px;border-radius:16px}.frame::before{font-size:200px}}
.top{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.eyebrow{font-family:var(--f-latin);font-style:italic;font-size:clamp(16px,3.2vw,21px);letter-spacing:.12em;color:var(--amber)}
.ttl{display:inline-flex;align-items:center;gap:16px}
h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(30px,6.6vw,46px);letter-spacing:.16em;color:var(--gold);text-wrap:balance;line-height:1.2}
.seal{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:38px;height:58px;border-radius:4px;background:var(--seal);color:var(--seal-ink);font-family:var(--f-display);font-size:17px;font-weight:700;line-height:1.15;box-shadow:inset 0 0 0 2px rgba(227,192,133,.75),0 4px 10px -4px rgba(0,0,0,.6);transform:rotate(-3deg);flex:none}
.vol{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:2px 10px;font-family:var(--f-display);font-size:17px;letter-spacing:.12em;color:var(--text);text-align:center}
.vol b{font-weight:700;color:var(--gold);white-space:nowrap}
.sub{margin:0;color:var(--mute);font-size:17px;max-width:40em}
.backs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;font-size:15px}
.backs a{color:var(--text);text-decoration:none;border-bottom:1px solid var(--line-2)}
.backs a:hover{color:var(--gold);border-bottom-color:var(--gold)}
.backs a.yt{color:var(--gold)}
.pins{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:20px 0 0}
.pin{display:flex;align-items:baseline;gap:8px;padding:7px 16px;border:1px solid rgba(217,184,124,.4);border-radius:999px;background:rgba(227,192,133,.05);transition:border-color .2s,transform .2s}
.pin b{font-family:var(--f-display);font-weight:500;font-size:14px;color:var(--mute)}
.pin span{font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--text)}
.pin:hover{border-color:var(--gold);transform:translateY(-1px)}
.pin[aria-current="true"]{border-color:var(--gold);background:linear-gradient(180deg,#e8c886,#c9a96e);box-shadow:0 4px 12px -5px rgba(217,184,124,.6)}
.pin[aria-current="true"] b{color:#4a3a28}.pin[aria-current="true"] span{color:#2c241c}
@media (max-width:520px){.pin{padding:6px 12px}.pin span{font-size:16px}}
.stages{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:26px 0 0;padding:12px;border:1px solid var(--line);border-radius:12px;background:rgba(29,23,17,.35)}
@media (max-width:520px){.stages{grid-template-columns:repeat(2,minmax(0,1fr));padding:10px}.stg span{font-size:17px}}

.stg{display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 4px 7px;border:1px solid rgba(217,184,124,.32);border-radius:8px;background:rgba(227,192,133,.05);text-align:center;min-width:0;transition:border-color .2s,transform .2s,box-shadow .2s}
.stg:hover{border-color:var(--gold);transform:translateY(-2px)}
.stg b{font-family:var(--f-display);font-weight:500;font-size:13px;color:var(--mute)}
.stg span{font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.4;color:var(--text)}
.stg em{font-style:italic;font-family:var(--f-latin);font-size:15px;color:var(--amber);min-height:1.2em;line-height:1.3}
.stg[aria-current="true"]{border-color:var(--gold);background:linear-gradient(180deg,#e8c886,#c9a96e);box-shadow:0 6px 16px -8px rgba(217,184,124,.7)}
.stg[aria-current="true"] b,.stg[aria-current="true"] em{color:#4a3a28}
.stg[aria-current="true"] span{color:#2c241c;font-weight:700}
main{position:relative;margin-top:22px}
.panel{display:flex;flex-direction:column;gap:16px}
.ptitle{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;border-bottom:1px dashed var(--line);padding-bottom:10px}
.ptitle h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(23px,4.6vw,28px);letter-spacing:.08em;color:var(--gold)}
.ptitle p{margin:0;font-family:var(--f-latin);font-style:italic;font-size:18px;color:var(--amber)}
.hint{margin:0;color:var(--mute);font-size:17px}
.retreat{margin:0;font-size:17px;color:var(--gold);border-left:2px solid var(--gold-line);padding-left:12px}
.qrow{display:flex;gap:18px;align-items:flex-start;border:1px solid var(--line-2);border-radius:var(--r);padding:18px;background:linear-gradient(180deg,rgba(227,192,133,.09),rgba(44,36,28,.6))}
.pill{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;width:72px}
.pill i{font-style:normal;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;min-height:72px;padding:8px 6px;border-radius:4px;background:var(--seal);color:var(--seal-ink);font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.12em;box-shadow:inset 0 0 0 2px rgba(227,192,133,.7),0 4px 10px -4px rgba(0,0,0,.6);transform:rotate(-2deg)}
.pill small{font-size:13px;color:var(--mute);letter-spacing:.06em;text-align:center}
.qt{min-width:0;display:flex;flex-direction:column;gap:6px}
.qbig{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(22px,4.6vw,30px);line-height:1.5;color:var(--cream);text-wrap:balance}
.qmeta{margin:0;font-size:16px;color:var(--mute)}
.qmeta b{color:var(--text);font-weight:500}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:680px){.opts{grid-template-columns:1fr 1fr}}
.opt{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid rgba(217,184,124,.34);border-radius:10px;background:rgba(227,192,133,.05);padding:13px 16px;min-width:0;transition:border-color .2s,background .2s}
.opt strong{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--text)}
.opt span{font-size:15px;color:var(--mute)}
.opt.plain{font-size:18px;line-height:1.6;color:var(--text)}
.opt:hover:not(:disabled){border-color:var(--gold);background:rgba(227,192,133,.11)}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-bg);border-color:var(--ok)} .opt.right strong,.opt.plain.right{color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)} .opt.wrong strong,.opt.plain.wrong{color:var(--bad)}
.opt.dim{opacity:.45}
.fb{border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line-2);background:var(--ink-2)}
.fb.ok{border-color:rgba(165,214,174,.55);background:linear-gradient(180deg,var(--ok-bg),rgba(44,36,28,.6))}
.fb.no{border-color:rgba(240,160,132,.55);background:linear-gradient(180deg,var(--bad-bg),rgba(44,36,28,.6))}
.fb h3{margin:0;font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:.06em}
.fb.ok h3{color:var(--ok)} .fb.no h3{color:var(--bad)}
.fb p{margin:0}
.fb b{color:var(--cream);font-weight:600}
.verse{border:1px solid var(--gold-line);border-radius:10px;padding:12px 18px;background:var(--gold-wash);box-shadow:inset 0 0 0 3px rgba(36,29,22,.55),inset 0 0 0 4px rgba(227,192,133,.2)}
.verse .lab{font-size:14px;letter-spacing:.12em;color:var(--gold);font-weight:700}
.verse .ln{margin:0;font-family:var(--f-display);font-weight:600;font-size:clamp(19px,4vw,22px);line-height:1.85;color:var(--cream);letter-spacing:.04em}
.quote{margin:0;font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.8;color:var(--cream)}
.vlink{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0;font-size:16px}
.vlink a{text-decoration:none;border-bottom:1px solid var(--gold-line)}
.vlink a:hover{color:var(--cream);border-bottom-color:var(--cream)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1px solid rgba(217,184,124,.4);border-radius:999px;background:rgba(227,192,133,.05);padding:7px 18px;font-size:17px;font-family:var(--f-display);font-weight:600;color:var(--text)}
.chip:hover:not(:disabled){border-color:var(--gold);background:rgba(227,192,133,.13)}
.chip.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)} .chip.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.score{font-size:16px;color:var(--mute);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--gold);border-radius:999px;padding:10px 24px;background:linear-gradient(180deg,#e8c886,#c9a96e);color:#2c241c;font-weight:700;letter-spacing:.1em;font-size:17px;box-shadow:0 4px 12px -5px rgba(217,184,124,.6)}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{background:rgba(227,192,133,.06);color:var(--text);border-color:var(--line-2);box-shadow:none}
.btn:disabled{opacity:.4;cursor:default}
.olist{display:flex;flex-direction:column;gap:10px}
.ocard{display:flex;gap:14px;align-items:flex-start;text-align:left;border:1px solid rgba(217,184,124,.32);border-radius:10px;background:rgba(227,192,133,.05);padding:12px 16px;transition:border-color .2s}
.ocard:hover{border-color:var(--gold)}
.ocard .n{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px dashed var(--amber);font-family:var(--f-latin);font-size:19px;color:var(--amber);font-variant-numeric:tabular-nums}
.ocard.sel{border-color:var(--line-2);background:rgba(227,192,133,.11)}
.ocard.sel .n{background:var(--seal);border:none;color:var(--seal-ink);font-weight:600;box-shadow:inset 0 0 0 1.5px rgba(227,192,133,.7)}
.ocard .t{min-width:0;font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.6;color:var(--text)}
.ocard .t .score{font-family:var(--f-body);font-weight:400;font-size:15px}
.ocard .t a{font-family:var(--f-body);font-weight:500;font-size:15px;text-decoration:none;white-space:nowrap}
.ocard.good{background:var(--ok-bg);border-color:rgba(165,214,174,.6)} .ocard.good .n{background:var(--ok);border:none;color:#12261a}
.ocard.badpos{background:var(--bad-bg);border-color:rgba(240,160,132,.6)} .ocard.badpos .n{background:var(--bad);border:none;color:#2a120b}
.link{margin:-2px 0 0 48px;font-size:16px;color:var(--gold)}
.blank{display:inline-block;min-width:2.4em;border-bottom:2px solid var(--gold);text-align:center;color:var(--gold)}
.blank.filled{border-bottom-color:var(--ok);color:var(--ok)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.mcol h4{margin:0;font-size:15px;color:var(--mute);font-weight:500;letter-spacing:.1em}
.mi{text-align:left;border:1px solid rgba(217,184,124,.32);border-radius:10px;background:rgba(227,192,133,.05);padding:11px 13px;font-size:17px;line-height:1.55;min-width:0;color:var(--text)}
.mi:hover:not(:disabled){border-color:var(--gold)}
.mi.pick{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset;background:rgba(227,192,133,.14)}
.mi.done{background:var(--ok-bg);border-color:var(--ok);opacity:.6}
.mi.shake{background:var(--bad-bg);border-color:var(--bad)}
.mi .src{display:block;font-size:13px;color:var(--amber);letter-spacing:.08em}
.end{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.big{margin:0;font-family:var(--f-latin);font-weight:500;font-size:clamp(34px,7vw,46px);line-height:1.2;color:var(--gold);font-variant-numeric:tabular-nums}
.road{display:flex;flex-wrap:wrap;gap:6px 4px;align-items:center;font-family:var(--f-display);font-size:16px;color:var(--text)}
.road span{border:1px solid var(--line-2);border-radius:6px;padding:2px 10px;background:rgba(227,192,133,.06)}
.road i{font-style:normal;color:var(--amber)}
.foot{position:relative;margin-top:26px;padding-top:14px;border-top:1px dashed var(--line);color:var(--mute);font-size:15px;display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between}
.foot i{font-family:var(--f-latin);letter-spacing:.1em;color:var(--amber)}
@media (prefers-reduced-motion:no-preference){
  .fb,.end{animation:rise .3s ease-out}
  @keyframes rise{from{transform:translateY(6px)}to{transform:none}}
}
</style>

/* ───────── 資料：卷一各品（原典與白話依讀本逐字；說明依導讀影片解說） ───────── */
const P={"1":{"pin":1,"name":"僧叡釋論序","short":"僧叡序","vid":"g-GqcqtFp5Q","dur":"17:30","who":"序文","sub":"看完導讀影片，換你上場：疑者一路發問，你替僧叡接招。六關由易而難，最後把八段序文走成一條路。","o1t":"序脈排序","o1h":"僧叡的序文，一段接一段回答讀者心裡的疑問：前一段的答案，引出下一段的問題。依序文先後點選排序。","end1":"九個疑問一路走完：從萬有的無生，走到手上這部譯本。下面是序文八段走成的路。","end2":"請帶走頭尾兩句：「無生、無始，物之性也」；「略其文而挹其玄」。","w1t":"難句白話","SEG":{"1":{"lab":"第一段","n":"生者無生・其唯邪思","t":100,"ch":2},"2":{"lab":"第二段","n":"阿含為之作・般若為之照","t":197,"ch":3},"3":{"lab":"第三段","n":"馬鳴龍樹・作茲釋論","t":296,"ch":5},"4":{"lab":"第四段","n":"其為論也・盡美盡善","t":401,"ch":7},"5":{"lab":"第五段","n":"羅什入長安・逍遙園譯場","t":487,"ch":8},"6":{"lab":"第六段","n":"三分除二・得此百卷","t":629,"ch":9},"7":{"lab":"第七段","n":"智慧日已頹・斯人令再曜","t":720,"ch":10},"8":{"lab":"第八段","n":"裁而略之・略其文而挹其玄","t":841,"ch":12}},"ROAD":["生者無生","阿含與般若","馬鳴龍樹","盡美盡善","羅什譯場","得此百卷","智慧日已頹","略文挹玄"],"A":[{"id":"A1","seg":1,"round":"第一段","q":"萬物明明生生不息，怎麼說「生者無生」？","basis":"眼見萬物一直生起、一直變化","keep":"萬物實在地生起、有個開端","name":"生者無生・其唯邪思","tag":"無生無始是物之性；紛擾出在邪思","gist":"萬有看似從不斷的生起中生出，但生者無生；變化看似從事物的開端開始，但始者無始。生與始從來沒有動搖這個本性；萬象紛陳於外、悔恨憂惱生於內，問題不在萬有，而在錯誤的思惟。","src":[{"lab":"原典・第一段","q":"夫萬有本於生生而生，生者無生；變化兆於物始而始，始者無始。然則無生、無始，物之性也。"},{"lab":"原典・第一段","q":"生、始不動於性，而萬有陳於外、悔吝生於內者，其唯邪思乎！"}],"next":"病根既然在邪思，接著要問：佛用什麼來對治？"},{"id":"A2","seg":2,"round":"第二段","q":"病在邪思，佛說阿含就夠了，何必再說般若？","basis":"阿含已有一套對治的方法","keep":"只要阿含就足夠","name":"阿含為作・般若為照","tag":"見邪思自起而說阿含；知滯有由惑而說般若","gist":"佛看見邪思如何自己生起，所以說阿含來對治；又知道眾生執著於「有」是由於迷惑，所以再說般若來照破。一個是「作」，一個是「照」。","src":[{"lab":"原典・第二段","q":"正覺有以見邪思之自起故，阿含為之作；知滯有之由惑故，般若為之照。"}],"next":"般若是「照」；可是這個照，能用言語、心智拿到手嗎？"},{"id":"A3","seg":2,"ch":4,"round":"第二段","q":"般若既然是照，用言語講清楚、用心智推量，不就得到了？","basis":"凡事都說得出、想得通","keep":"言語與心智到得了般若","name":"言求乖深・智測失旨","tag":"照本希夷，理超文表，趣絕思境","gist":"般若所照的，幽微難見，像無邊的大水；道理超過文字，旨趣斷絕思量。用言語去求，就背離它的深；用心智去測，就失去它的旨。二乘在三藏裡跌撞、雜學像魚躍不過龍門，都是這個緣故。","src":[{"lab":"原典・第二段","q":"然而照本希夷，津涯浩汗，理超文表，趣絕思境。以言求之，則乖其深；以智測之，則失其旨。"},{"lab":"原典・第二段","q":"二乘所以顛沛於三藏，雜學所以曝鱗於龍門者，不其然乎！"}],"next":"言語、心智都到不了；佛滅之後，誰來傳般若？馬鳴與龍樹的做法，為什麼不一樣？"},{"id":"A4","seg":3,"round":"第三段","q":"馬鳴振起遺風就夠了，龍樹何必入龍宮、造大論？","basis":"馬鳴在正法之餘，振起遺風就弘揚開來","keep":"一種弘法方式通用各個時代","name":"正餘易弘・像末多端","tag":"馬鳴直振遺風；龍樹寄跡凡夫、假照龍宮，作茲釋論","gist":"馬鳴出現在正法將盡之時，正法餘緒還容易弘揚，振起、擦亮遺風就夠了。龍樹生在像法之末，頭緒繁多，於是託身凡夫、漸次開悟眾生；又入龍宮，磨亮探求玄義的智慧，這才依準佛的智慧經典造了這部釋論——開闢平坦大道，讓妄見不必走遠就自己回正。","src":[{"lab":"原典・第三段","q":"是以馬鳴起於正法之餘，龍樹生於像法之末。正餘易弘故，直振其遺風瑩拂而已。"},{"lab":"原典・第三段","q":"像末多端故，乃寄跡凡夫示悟物以漸，又假照龍宮以朗搜玄之慧，託聞幽祕以窮微言之妙，爾乃憲章智典作茲釋論。"}],"next":"龍樹造了論；這部論怎麼寫，才讓千年後的人讀得懂？"},{"id":"A5","seg":4,"round":"第四段","q":"寫論何必先列各家異說？直接講正確答案不就好了？","basis":"正確的說法只要一個","keep":"只立一家之說","name":"標眾異・舉無執","tag":"初標眾異以盡美，終舉無執以盡善","gist":"這部論一開頭，一定先把各種不同的說法都標列出來，這叫盡美；到最後，舉出無所執著，這叫盡善。經文解釋不盡，就另立論議說明；論議還沒辨清，就折中論定。先盡列眾說，再歸於無執，不落兩邊。","src":[{"lab":"原典・第四段","q":"其為論也，初辭擬之，必標眾異以盡美；卒成之終，則舉無執以盡善。釋所不盡，則立論以明之；論其未辯，則寄折中以定之。"}],"next":"論在天竺寫成了；它怎麼來到長安，又為什麼要大開譯場？"},{"id":"A6","seg":5,"round":"第五段","q":"羅什與秦王晤談已經很深，何必再集五百多人來譯？","basis":"兩人心意相契，終日研討","keep":"兩人心契就夠了","name":"弘兼忘之慧・集逍遙園","tag":"恨獨符之心不曠，惜津梁之勢未普","gist":"兩人晤談雖深，可惜這份心契只在兩人之間，未能廣被；窮究的要義雖玄，可惜度人的橋樑還沒普及。於是召集京城研習義理的沙門，與公卿中意氣相投的五百多人，會集在渭水邊的逍遙園堂，依梵本考正名相，為後來的人鋪平道路。","src":[{"lab":"原典・第五段","q":"又以晤言之功雖深，而恨獨符之心不曠；造盡之要雖玄，而惜津梁之勢未普。"},{"lab":"原典・第五段","q":"乃集京師義業沙門，命公卿賞契之士五百餘人，集於渭濱逍遙園堂。"}],"next":"譯場開了；可是梵本那麼龐大，為什麼只有一百卷？"},{"id":"A7","seg":6,"round":"第六段","q":"梵本十萬偈、三百二十萬言，只譯成百卷，不就殘缺了？","basis":"刪去了三分之二","keep":"字字譯全才算完整","name":"三分除二・朗然可見","tag":"梵夏既乖、煩簡有異；文雖刪略，玄旨可見","gist":"論的略本有十萬偈，每偈三十二字，共三百二十萬言。梵語和漢語體例不同，又有繁簡的差別，於是刪去三分之二，成為這一百卷。在這三十萬言裡，深玄的章句、婉曲的旨趣都清楚可見，歸途直達，不再有走錯方向的疑惑。","src":[{"lab":"原典・第六段","q":"論之略本有十萬偈，偈有三十二字，并三百二十萬言。梵夏既乖，又有煩簡之異，三分除二，得此百卷。"},{"lab":"原典・第六段","q":"於大智三十萬言，玄章婉旨，朗然可見，歸途直達，無復惑趣之疑，以文求之無間然矣。"}],"next":"回頭看天竺怎麼看待造論的人：馬鳴、龍樹為什麼被宗之若佛？"},{"id":"A8","seg":7,"round":"第七段","q":"天竺為馬鳴、龍樹立廟，宗之若佛，不是推崇太過？","basis":"造論的人畢竟不是佛","keep":"造論的人不該受這樣的尊崇","name":"智慧日頹・斯人再曜","tag":"虛言與實教並興，嶮徑與夷路爭轍，非二匠孰能正之","gist":"那時邪法盛行，虛妄的言說和真實的教法一起流行，險路和平坦大道爭著並行，初學的人被帶偏，求道的人被迷惑；除了這兩位大匠，誰能匡正？所以天竺歌頌：智慧的太陽已經西沉，是這個人讓它再放光明。","src":[{"lab":"原典・第七段","q":"虛言與實教並興，嶮徑與夷路爭轍，始進者化之而流離，向道者惑之而播越，非二匠其孰與正之！"},{"lab":"原典・第七段・天竺歌詠","v":["智慧日已頹，斯人令再曜；","世昏寢已久，斯人悟令覺。"]}],"next":"讚歎之後，僧叡回到手上這部譯本：譯得不盡，讀者該怎麼讀？"},{"id":"A9","seg":8,"round":"第八段","q":"羅什自己說秦語只通大略，譯文又不修飾，這樣讀得準嗎？","basis":"言語不能互相會意","keep":"譯文要修飾到無可挑剔","name":"案譯而書・略文挹玄","tag":"不停筆爭是，不簡而便之；略其文而挹其玄","gist":"停筆爭辯，整天也爭不出結果；只求簡便，又怕落入穿鑿的譏評。所以只依原譯如實書寫，不加修飾。最後一句是整篇序的囑咐：希望明悟的讀者，略過文字，汲取其中的玄旨。","src":[{"lab":"原典・第八段","q":"進欲停筆爭是，則交競終日卒無所成；退欲簡而便之，則負傷於穿鑿之譏以二三。唯案譯而書，都不備飾。"},{"lab":"原典・第八段","q":"幸冀明悟之賢，略其文而挹其玄也！"}],"next":""}],"W":[{"seg":1,"q":"萬有陳於外、悔吝生於內","a":"萬象紛陳於外、悔恨憂惱生於內心","x":["萬物排列在外，後悔與吝嗇是天生的性格","災禍從外面來，吝嗇從家裡生","萬物都在心內生起，外面什麼也沒有"]},{"seg":2,"q":"照本希夷，津涯浩汗","a":"幽微難見、境界如汪洋無涯","x":["依照經本讀誦，文義浩繁","般若的光微弱，只照到岸邊","渡口邊的人汗流浹背"]},{"seg":2,"q":"理超文表，趣絕思境","a":"道理超越文字所能表達，旨趣斷絕一切思量所能到達","x":["道理寫在文字表面，趣味要靠思考","只要文字寫得好，就能想通道理","道理超出表格，趣味絕妙"]},{"seg":2,"q":"以言求之，則乖其深；以智測之，則失其旨","a":"用語言去求它反而背離其深妙，用心智去測它反而失卻其本旨","x":["用語言去求才能得其深妙，用心智去測才能得其本旨","語言太深奧，心智太乖巧","先用語言求，再用心智測，就能得到"]},{"seg":2,"q":"雜學所以曝鱗於龍門","a":"外道雜學之所以如魚曝鱗於龍門（躍不過去）","x":["雜學像鯉魚躍過龍門，化而為龍","雜學在龍門講經，炫耀才學","雜學把經書曬在龍門上"]},{"seg":3,"q":"正餘易弘故，直振其遺風瑩拂而已","a":"直接振起、擦亮佛陀遺留的風範就夠了","x":["直接改寫佛陀的教法","把遺風吹散，另立新說","只在風中拂拭灰塵，別無作為"]},{"seg":3,"q":"寄跡凡夫示悟物以漸","a":"託身凡夫之相、循序漸進地開悟眾生","x":["寄信給凡夫，一次把道理說盡","隱居山林，不與凡夫往來","以神通示現，令眾生頓時開悟"]},{"seg":3,"q":"假照龍宮以朗搜玄之慧","a":"藉入龍宮閱藏磨亮探幽的智慧","x":["假裝去過龍宮，以取信於人","借龍宮的燈火照明讀經","到龍宮搜尋寶物"]},{"seg":3,"q":"爾乃憲章智典作茲釋論","a":"依準佛的智慧經典，造出這部《釋論》","x":["制定法律條文，寫成這部論","把智慧經典改寫成國家典章","替國家的典章作注解"]},{"seg":3,"q":"其辯實相也，則使妄見之惑不遠而自復","a":"使虛妄知見的迷惑不必走遠就能自行回正","x":["讓妄見遠離，永遠不再回來","讓迷惑的人走到遠方再回頭","讓妄見在不遠處消失又復生"]},{"seg":5,"q":"常杖茲論為淵鏡憑高","a":"常以這部論作為深鑑高台","x":["常拄著這部論當手杖走路","常把這部論藏在深淵裡","常用這部論去打擊異說"]},{"seg":5,"q":"秦王虛襟既已蘊在","a":"秦王（姚興）早已虛心期待、蘊蓄敬慕","x":["秦王的衣襟空空，十分清貧","秦王心中早有疑慮","秦王已經虛位讓賢"]},{"seg":5,"q":"而恨獨符之心不曠","a":"遺憾只有兩人心契、未能廣被","x":["恨自己孤獨，心胸不夠開闊","怨恨別人與自己意見不合","遺憾符命不在，國運不廣"]},{"seg":5,"q":"鑾輿佇駕於洪涘，禁禦息警於林間","a":"天子車駕駐臨渭水之濱，禁衛在林間止息戒備","x":["天子的車駕在洪水中翻覆，禁衛在林間警戒","鑾鈴響起，禁衛四處巡邏","天子駕車遠行，禁止百姓入林"]},{"seg":6,"q":"梵夏既乖，又有煩簡之異","a":"梵語與漢語體例既不同、又有繁簡之別","x":["梵本與夏本互相違背，內容不同","夏天譯經有誤，改到冬天才簡化","梵僧與漢僧意見不合，又嫌麻煩"]},{"seg":6,"q 此二邊，令入中道。","o1t":"因緣排序","o1h":"龍樹一段一段「復次」，回答讀者心裡的疑問：前一個答案，引出下一個問題。依論文先後點選排序。","end1":"十三個疑問一路走完：從「何等大因緣」，走到佛滅之後般若的流布。下面是本品走成的路。","end2":"請帶走這一句：「佛欲拔此二邊，令入中道」——不貪身樂，不執苦行，兩邊都不取。","SEG":{"0":{"lab":"問曰","n":"佛以何因緣說般若","t":82,"ch":1},"1":{"lab":"第一因緣","n":"為廣說菩薩行故","t":178,"ch":3},"2":{"lab":"第二因緣","n":"為增益念佛三昧故","t":271,"ch":3},"3":{"lab":"第三因緣","n":"菩薩本願與成道故","t":371,"ch":3},"4":{"lab":"第四因緣","n":"斷一切智之疑故","t":573,"ch":4},"5":{"lab":"第五因緣","n":"度惡師所惑眾生故","t":662,"ch":5},"6":{"lab":"第六因緣","n":"斷貢高邪慢故","t":781,"ch":5},"7":{"lab":"第七因緣","n":"令人信受法故","t":871,"ch":5},"8":{"lab":"第八因緣","n":"令眾生歡喜故","t":940,"ch":5},"9":{"lab":"第九因緣","n":"大醫王治結使病故","t":1026,"ch":5},"10":{"lab":"第十因緣","n":"佛身不可思議故","t":1098,"ch":4},"11":{"lab":"第十一因緣","n":"方便示現人法故","t":1284,"ch":5},"12":{"lab":"第十二因緣","n":"拔二邊入中道故","t":1526,"ch":5},"13":{"lab":"第十三因緣","n":"分別供養果報故","t":1616,"ch":4},"14":{"lab":"第十四因緣","n":"說阿鞞跋致相故","t":1682,"ch":6},"15":{"lab":"第十五因緣","n":"為當來世人故","t":1744,"ch":6}},"ROAD":["何等大因緣","為菩薩說","斷疑令信","拔二邊入中道","護法流布"],"A":[{"id":"C0","seg":0,"round":"問曰","q":"佛要說法，隨時開口就好，何必問什麼「大因緣」？","basis":"說法是佛的日常","keep":"佛說法不需要特別的因緣","name":"須彌山王不輕動","tag":"諸佛不以無事及小因緣而自發言","gist":"諸佛說法，絕不會因為沒事、或只是小因緣就隨意開口，就像須彌山王不會因為沒事或小因緣就搖動。所以龍樹不問「有沒有因緣」，直問「何等大因緣」；整部論以問破執的風格，從這一問開始。","src":[{"lab":"原典・問曰","q":"諸佛法不以無事及小因緣而自發言，譬如須彌山王不以無事及小因緣而動。"}],"next":"大因緣是什麼？第一個答案，要從佛先前說過的三藏講起。"},{"id":"C1","seg":1,"round":"第一因緣","q":"佛在三藏已經說了那麼多法，為什麼還要說般若？","basis":"三藏廣引種種譬喻說法","keep":"三藏已經說盡了","name":"為廣說菩薩行","tag":"三藏為聲聞說，不說菩薩道；般若為彌勒等廣說菩薩行","gist":"佛在三藏中廣引種種譬喻，是為聲聞說法，並沒有宣說菩薩道；只在《中阿含．本末經》授記彌勒將來作佛，也沒有詳說菩薩行。佛如今要為彌勒等廣說菩薩行，所以說這部經。聲聞道與菩薩道，是同一位佛隨眾生根機先後開展的教法。","src":[{"lab":"原典・第一因緣","q":"佛於三藏中，廣引種種諸喻，為聲聞說法，不說菩薩道。"},{"lab":"原典・第一因緣","q":"佛今欲為彌勒等廣說諸菩薩行，是故說《摩訶般若波羅蜜經》。"}],"next":"說菩薩行之外，經裡還有放光、現大身的神變——那又為了什麼？"},{"id":"C2","seg":2,"round":"第二因緣","q":"佛現神足、放金色光明，不是在炫耀嗎？","basis":"神變聲勢浩大","keep":"神變只是展示威力","name":"增益念佛三昧","tag":"給已修念佛三昧的菩薩一個更殊勝的所緣","gist":"有菩薩正在修念佛三昧，佛為了讓他們在這三昧上更加增進，示現神足、放光、現大身；諸菩薩見佛神變，於念佛三昧倍復增益。神變不是炫耀，是更殊勝的所緣。","src":[{"lab":"原典・第二因緣","q":"諸菩薩見佛神變，於念佛三昧倍復增益，以是事故說《摩訶般若波羅蜜經》。"}],"next":"再往前追：佛為什麼願意開口說法？要從他初生時的誓願說起。"},{"id":"C3","seg":3,"round":"第三因緣","q":"佛已經得解脫了，何必再辛苦說法？","basis":"解脫就是事情辦完了","keep":"得解脫就到此為止","name":"本願：當復度眾生","tag":"「我已得解脫，當復度眾生」；念本所願，大慈大悲故受請說法","gist":"菩薩初生時就說：「我已得解脫，當復度眾生。」後來捨苦行、坐菩提樹下成道，梵天王等勸請轉法輪；菩薩念本所願，以及大慈大悲，所以受請說法。「當復度眾生」的本願，是佛說法的根源。","src":[{"lab":"原典・第三因緣","v":["我生胎分盡，是最末後身；","我已得解脫，當復度眾生。"]},{"lab":"原典・第三因緣","q":"亦是菩薩念本所願，及大慈大悲故，受請說法。"}],"next":"說法的根源立了，接著是種種疑問：第一個疑，就衝著佛的智慧來。"},{"id":"C4","seg":4,"round":"第四因緣","q":"諸法無量無數，一個人怎麼可能知道一切法？","basis":"法太多，數不完","keep":"一切智要把諸法一一算完","name":"住實相，一切智人","tag":"佛住般若實相，清淨如虛空，自發誠言「我是一切智人」","gist":"一切智不是把無量諸法一件一件算完，而是住於般若波羅蜜的實相，清淨如虛空；所以佛能在無量無數法中，親口誠實宣說「我是一切智人」，斷一切眾生的疑。","src":[{"lab":"原典・第四因緣","q":"佛住般若波羅蜜實相清淨如虛空，無量無數法中，自發誠言：「我是一切智人。」"}],"next":"有人只是疑；也有人懷著嫉妒，直接誹謗。"},{"id":"C6","seg":6,"round":"第六因緣","q":"佛的智慧不比人高，只是用幻術迷惑世人？","basis":"嫉妒心起的誹謗","keep":"佛只是會變把戲的人","name":"破貢高邪慢","tag":"現無量神力、智慧力；一念惡、一念淨信，果報懸殊","gist":"有惡邪人懷著嫉妒，誹謗佛只是以幻術惑世。佛為了斷他們的貢高邪慢，現無量神力、無量智慧力，並說：一發惡念，獲罪無量；一發淨信，受人天樂，必得涅槃果。","src":[{"lab":"原典・第六因緣","q":"若一發惡念，獲罪無量；一發淨信，受人天樂，必得涅槃果。"}],"next":"破了誹謗，佛又自稱大師、說十力四無所畏——這不是自誇嗎？"},{"id":"C7","seg":7,"round":"第七因緣","q":"佛自稱大師、有十力四無所畏，不是在自誇嗎？","basis":"聖者應該謙虛","keep":"說自己的功德就是自誇","name":"令人信受法","tag":"說十力、四無所畏，是讓人對法生起信心","gist":"佛說「我是大師，有十力、四無所畏……於一切世界最尊最上」，不是為了自誇，而是欲令人信受法；信，是入法的門。","src":[{"lab":"原典・第七因緣","q":"欲令人信受法故，言：「我是大師，有十力、四無所畏"}],"next":"信心之後，是眾生的病：無始以來的煩惱，誰能治？"},{"id":"C9","seg":9,"round":"第九因緣","q":"眾生的煩惱從無始以來就在，誰治得好？","basis":"外道惡師也治不好","keep":"煩惱病無藥可醫","name":"大醫王集法藥","tag":"眾生的病是結使，佛的藥是法；藥要自己服","gist":"一切眾生被結使病所苦，無始生死以來，無人能治，常被外道惡師所誤。佛說：我今出世為大醫王，集諸法藥，汝等當服。藥要自己服，病才會好。","src":[{"lab":"原典・第九因緣","q":"我今出世為大醫王，集諸法藥，汝等當服。"}],"next":"藥是佛給的；可是也有人想：佛也是人，一樣會老會病。"},{"id":"C10","seg":10,"round":"第十因緣","q":"佛跟我們一樣，也有生死、會飢渴寒熱、老病？","basis":"佛也有人身","keep":"佛身與凡人無異","name":"佛身不可思議","tag":"梵天王等於恒河沙劫中，也測度不了佛身、佛聲","gist":"有人以為佛與人同，實受飢渴、寒熱、老病苦。佛為了斷這個想法，說：我身不可思議，梵天王等諸天祖父，於恒河沙等劫中，想思量佛身、尋究佛聲，都不能測度，何況佛的智慧三昧。","src":[{"lab":"原典・第十因緣","q":"我身不可思議，梵天王等諸天祖父，於恒河沙等劫中，欲思量我身、尋究我聲，不能測度，況我智慧三昧？"}],"next":"佛身既然不可思議，為什麼他生下來能走能說，後來卻又像嬰孩一樣？"},{"id":"C11","seg":11,"round":"第十一因緣","q":"佛生下來就能走七步、開口說話，後來為什麼又像嬰孩一樣不行不語？","basis":"前後不一，令人奇怪","keep":"佛的示現前後矛盾","name":"方便示現人法","tag":"現作嬰孩、漸次長大，令眾生信於深法","gist":"佛身無數，過諸世間，為眾生故現如凡人。若菩薩生來便能行能語，世人會想：這必是天龍鬼神，所學之法不是我們能及的，因而自絕。所以佛以方便力，現行人法，讓眾生相信：深法，凡人也學得到。","src":[{"lab":"原典・第十一因緣","q":"以方便力，現行人法，如人威儀，令諸眾生信於深法。"}],"next":"凡人修行又常走偏：不是貪樂，就是苦行。"},{"id":"C12","seg":12,"round":"第十二因緣","q":"修行總要選一邊：要嘛享樂，要嘛苦行？","basis":"不樂即苦，不苦即樂","keep":"苦、樂總有一邊是道","name":"拔二邊，入中道","tag":"不貪身樂，不執苦行；兩邊都不取","gist":"有人因為無智，只求身樂；有人為了求道，執著苦行；這兩種人在第一義中都失去涅槃正道。佛欲拔此二邊，令入中道——中道不是兩邊的折衷，而是兩邊都不取。","src":[{"lab":"原典・第十二因緣","q":"或以無智故，但求身樂；或有為道故，修著苦行。"},{"lab":"原典・第十二因緣","q":"佛欲拔此二邊，令入中道，故說《摩訶般若波羅蜜經》。"}],"next":"走上中道之後，還要知道路上哪裡會退、哪裡會錯。"},{"id":"C14","seg":14,"round":"第十四因緣","q":"修行的人，怎麼知道自己會不會退轉、有沒有走錯？","basis":"修行路長，難免迷途","keep":"只能憑感覺摸索","name":"說不退轉相・辨魔事","tag":"說阿鞞跋致的相貌，也說魔幻、魔事","gist":"佛說阿鞞跋致（不退轉）的相貌，也說魔幻、魔事，讓修行的人知道哪裡會退、哪裡會錯。","src":[{"lab":"原典・第十四因緣","q":"欲說阿鞞跋致，阿鞞跋致相故說。又為魔幻、魔事故說。"}],"next":"最後一問，看向佛滅之後的世代。"},{"id":"C15","seg":15,"round":"第十五因緣","q":"佛涅槃之後，般若還傳得下去嗎？","basis":"佛已不在世間","keep":"佛滅度後般若就斷了","name":"為當來世人・正法流布","tag":"般若當至南方、西方、北方；書寫讀誦、正憶念修行，以法供養","gist":"佛告阿難：我涅槃後，此般若波羅蜜當至南方，從南方至西方，後五百歲中當至北方。自己書寫、教人書寫、讀誦、聽說、正憶念、修行，都是以法供養。","src":[{"lab":"原典・第十五因緣","q":"我涅槃後，此般若波羅蜜當至南方，從南方至西方，後五百歲中當至北方。"}],"next":""}],"W":[{"seg":0,"q":"譬如須彌山王不以無事及小因緣而動","a":"就像須彌山王，不會因為沒事或小因緣就搖動一樣","x":["就像須彌山王，每天無事就搖動一下","就像須彌山王，只為小事才移動","就像國王不在山中，就沒有事情發生"]},{"seg":1,"q":"為聲聞說法，不說菩薩道","a":"是為聲聞人說法，並沒有宣說菩薩道","x":["只說給聽得見聲音的人，聾人聽不到","為聲聞說法，又同時詳說菩薩道","聲聞說法給菩薩聽，菩薩不說話"]},{"seg":2,"q":"於念佛三昧倍復增益","a":"在念佛三昧上更加增進","x":["念佛的次數加倍，功德也加倍","念佛三昧反而退失","把念佛三昧分給更多人"]},{"seg":3,"q":"我生胎分盡，是最末後身","a":"我這一世投胎的因緣已經窮盡，這是我最後一次受生之身","x":["我在胎中的日子已經滿了，就要出生","我這一生的福分用盡了，身體快要不行","我生在家族的最後一代"]},{"seg":3,"q":"以上妙寶衣，貿麁布僧伽梨","a":"把身上珍貴的衣服換成粗布僧袍","x":["把粗布僧袍換成珍貴的衣服","把寶衣賣掉，買了很多布","穿上寶衣去參加僧團的法會"]},{"seg":3,"q":"是處非道","a":"這樣做並非真正的解脫之道","x":["這個地方不是道場","這條路走錯方向了","這裡不准講道"]},{"seg":4,"q":"自發誠言：「我是一切智人。」","a":"佛親口誠實宣說：「我是證得一切智的人。」","x":["佛自言自語：「我想成為一切智人。」","佛謙虛地說：「我不是一切智人。」","弟子替佛宣說：「他是一切智人。」"]},{"seg":5,"q":"為惡師所惑，心沒邪法","a":"被邪惡的師長所迷惑，心陷邪法之中","x":["被惡師迷惑，但心裡沒有邪法","惡師被迷惑，心中沒有正法","心中沒有法，所以去找惡師"]},{"seg":5,"q":"以大悲手授之","a":"用大悲的手接引他們","x":["用大手把東西交給他們","把大悲咒手寫給他們","用手勢傳授悲傷"]},{"seg":6,"q":"佛智慧不出於人，但以幻術惑世","a":"佛的智慧並不超過常人，只是用幻術來迷惑世人罷了","x":["佛的智慧不顯露在人前，只用幻術教化","佛的智慧沒有出人頭地，所以用幻術補足","佛不出門見人，只用幻術治世"]},{"seg":6,"q":"一發淨信，受人天樂","a":"若有人生一念清淨信心，則能享受人天的安樂","x":["發一次清淨的信，就能投胎做天人","寄出一封乾淨的信，人天都快樂","一發怒就失去信心，人天皆苦"]},{"seg":8,"q":"十力大師，難可值見","a":"具足十力的大導師，是很難值遇見到的","x":["力氣很大的老師，很難打得過","十位大師，很難一一拜見","十力大師見面要付很高的代價"]},{"seg":8,"q":"恣汝採取","a":"任憑你們自由採取受用","x":["放縱你們去偷取","你們只能取一點點","要經過允許才能取用"]},{"seg":9,"q":"一切眾生為結使病所煩惱","a":"一切眾生都被煩惱（結使）之病所苦","x":["眾生因為結婚生子而煩惱","眾生被繩結綁住，得了怪病","眾生因為出使遠方而生病"]},{"seg":11,"q":"乳餔三歲","a":"由乳母哺育三年","x":["三歲才開始喝奶","每天餵奶三次","三歲就自己吃飯"]},{"seg":12,"q":"或以無智故，但求身樂；或有為道故，修著苦行","a":"有人因為缺乏智慧，只求身體的享樂；也有人為了求道，卻執著於苦行","x":["有人沒有智慧，所以苦行；有人求道，所以享樂","有智慧的人享樂，求道的人苦行，兩者都對","無智的人修苦行，有智的人求身樂"]},{"seg":12,"q":"於第一義中，失涅槃正道","a":"在第一義諦中，都已經失去了通往涅槃的正道","x":["在第一名之中，失去了涅槃","第一個意思是：失去正道就能涅槃","涅槃的正道，排在第一位"]},{"seg":14,"q":"欲說阿鞞跋致，阿鞞跋致相故說","a":"佛想要宣說「阿鞞跋致」（不退轉菩薩）以及阿鞞跋致的種種相貌","x":["佛想說一位名叫阿鞞跋致的國王的故事","佛想說退轉菩薩的種種相貌","阿鞞跋致是一種咒語，佛想說它的讀法"]},{"seg":15,"q":"若自書，若教人書，若讀誦、聽說，正憶念、修行，以法供養","a":"如果自己書寫，或教他人書寫，或讀誦、聽聞講說，正確憶念、依法修行，這就是用法供養","x":["自己寫書賺錢，再拿錢去供養","只要買經書回家，就是法供養","請人代為讀誦，自己不必修行，也算法供養"]}],"F":[{"seg":0,"v":["譬如須彌山王不以無事及小因緣而動。"],"ln":0,"ans":"須彌山王","opts":["須彌山王","大海龍王","師子獸王","轉輪聖王"],"note":"問曰・大因緣之問"},{"seg":1,"v":["佛於三藏中，廣引種種諸喻，為聲聞說法，不說菩薩道。"],"ln":0,"ans":"菩薩道","opts":["菩薩道","聲聞道","緣覺道","人天道"],"note":"第一因緣"},{"seg":3,"v":["我生胎分盡，是最末後身；","我已得解脫，當復度眾生。"],"ln":1,"ans":"度眾生","opts":["度眾生","入涅槃","住寂滅","證菩提"],"note":"第三因緣・本願"},{"seg":3,"v":["而自念言：「是處非道！」"],"ln":0,"ans":"非道","opts":["非道","是道","正道","真道"],"note":"捨苦行，先走過一回中道"},{"seg":4,"v":["佛住般若波羅蜜實相清淨如虛空，","無量無數法中，自發誠言：「我是一切智人。」"],"ln":0,"ans":"虛空","opts":["虛空","明鏡","大海","蓮華"],"n ·辨魔事","本願為因·度生為果"]},{"seg":9,"q":"我今出世為大醫王，集諸法藥，汝等當服","a":"大醫王喻·對治悉檀","d":"「集諸法藥」對治無始以來的結使病，是四悉檀中「對治悉檀」最鮮明的譬喻。","o":["破邪顯正·以問啟論","令生信受·十力四無畏","拔二邊·入中道"]},{"seg":11,"q":"以方便力，現行人法，如人威儀","a":"方便示現·凡聖不二","d":"凡夫相是最深的慈悲與善巧，非降低真理遷就眾生，而是以能引發信心之姿示現真理。","o":["破貢高邪慢","正法流布·法供養殊勝","不退轉·辨魔事"]},{"seg":12,"q":"佛欲拔此二邊，令入中道","a":"拔二邊·入中道","d":"不偏樂行、不執苦行，正是中道的具體實踐，亦是第一義諦之直顯。","o":["本願為因·度生為果","令生信受·十力四無畏","世界悉檀·令眾生歡喜"]},{"seg":14,"q":"又為魔幻、魔事故說","a":"不退轉·辨魔事","d":"闡明不退轉菩薩相貌與魔事辨識，屬菩薩道實踐層面的保護與指引。","o":["破邪顯正·以問啟論","世界悉檀·令眾生歡喜","本願為因·度生為果"]},{"seg":15,"q":"若自書，若教人書，若讀誦、聽說，正憶念、修行，以法供養","a":"正法流布·法供養殊勝","d":"般若東傳的授記，顯法供養（書寫讀誦修行）果報殊勝，是般若法門跨越時空的弘傳承諾。","o":["大醫王喻·對治悉檀","破貢高邪慢","拔二邊·入中道"]}]},"4":{"pin":4,"name":"四悉檀","short":"四悉檀","vid":"dCcItiA5vuY","dur":"8:52","who":"論文","sub":"看完導讀影片，換你上場：疑者一路發問，你用四悉檀接招。最後帶走一句——八萬四千法藏，皆是實，無相違背。","o1t":"問題鏈排序","o1h":"原典只有四句，疑問卻一個接一個：前一個答案，引出下一個問題。依論文先後點選排序。","end1":"八個疑問一路走完：從「佛為何說般若」，走到「四重各實，彼此成全」。下面是本品走成的路。","end2":"請帶走這一句：「八萬四千法藏，皆是實，無相違背」——放回各自的悉檀，句句皆實。","CHL":{"1":"經論原典","2":"第一章","3":"第二章","4":"第三章","5":"第四章","6":"第五章","7":"第六章","8":"第七章","9":"第八章"},"SEG":{"1":{"lab":"第一段","n":"說經之由・欲說第一義悉檀相","t":89,"ch":1},"2":{"lab":"第二段","n":"四種悉檀・世界、為人、對治、第一義","t":167,"ch":3},"3":{"lab":"第三段","n":"皆是實・無相違背","t":282,"ch":2},"4":{"lab":"第四段","n":"各以故實・四重為實","t":372,"ch":8}},"ROAD":["說般若之由","世界悉檀","各各為人悉檀","對治悉檀","第一義悉檀","皆是實，無相違背"],"A":[{"id":"D1","seg":1,"round":"第一段","q":"佛說般若，究竟是為了什麼？","basis":"上一品已說了十五段大因緣","keep":"般若只是眾多經典之一","name":"欲說第一義悉檀相","tag":"佛說般若，是為了顯示第一義悉檀","gist":"龍樹再加一段「復次」：佛想要說第一義悉檀的相貌，所以說這部《般若波羅蜜經》。「悉檀」是梵文的音譯，原意是成就、宗旨，也就是一個說法所以能成立、能令人信受的理由。","src":[{"lab":"原典・第一段","q":"佛欲說第一義悉檀相故，說是《般若波羅蜜經》。"}],"next":"第一義悉檀，是不是踩在其他說法頭上的最高真理？"},{"id":"D2","seg":2,"round":"第二段","q":"第一義悉檀既然最高，其他說法不都只是假話？","basis":"真理只能有一層","keep":"只有第一義才算真","name":"四悉檀並列","tag":"第一義與世界、為人、對治並列，是讓其他三者站得住的根據","gist":"龍樹說佛說般若是為了顯示第一義悉檀，卻立刻把第一義放回四悉檀之中，與其他三者並列。第一義不是踩在其他三者頭上的另一層真理，而是讓其他三者都站得住的根據。","src":[{"lab":"原典・第二段","q":"有四種悉檀：一者、世界悉檀，二者、各各為人悉檀，三者、對治悉檀，四者、第一義悉檀。"}],"next":"四悉檀各說什麼？先看第一種：世間的話，算不算實？"},{"id":"D3","seg":2,"round":"第二段","q":"世間說我、說你、說善惡有報，只是俗話，不算實吧？","basis":"究竟說來沒有一個實在的我","keep":"世俗的說法都不真","name":"世界悉檀","tag":"隨順世間的語言與因果來說；車由眾緣和合，照樣能載人","gist":"世界悉檀，是隨順世間的語言與因果來說。就像一部車，由轅、軸、輻、輞種種零件和合而成；離開零件，找不到另外一部車，但車照樣能載人。世間說我、說你、說善惡有報，在這一層上都是實。","src":[{"lab":"原典・第二段","q":"一者、世界悉檀"}],"next":"同一個道理，佛對不同的人卻說法不同——這算前後不一嗎？"},{"id":"D4","seg":2,"round":"第二段","q":"同一個道理，佛對不同的人說法不同，不是前後不一？","basis":"真理應該只有一種說法","keep":"對每個人都該說同一句話","name":"各各為人悉檀","tag":"看聽法的人是誰，說合適的話；令他生起善根，就是實","gist":"各各為人悉檀：看聽法的人是誰、心在哪裡，說合適的話。同一個道理，對不同的人有不同的說法；能讓這個人生起善根，這句話對他就是實。","src":[{"lab":"原典・第二段","q":"二者、各各為人悉檀"}],"next":"有些話不只看人，更是看病。"},{"id":"D5","seg":2,"round":"第二段","q":"貪心重就觀不淨，瞋心重就修慈悲——這些藥一直吃下去就對了？","basis":"藥既然有效，就該一直吃","keep":"藥本身就是目的","name":"對治悉檀","tag":"法是藥，煩惱是病；藥對了病就是實，病好了藥也要放下","gist":"對治悉檀：法是藥，煩惱是病。貪心重的人教他觀不淨，瞋心重的人教他修慈悲。藥對了病，就是實；病好了，藥也要放下。","src":[{"lab":"原典・第二段","q":"三者、對治悉檀"}],"next":"四種說法並陳，到底哪一句才是真的？"},{"id":"D6","seg":3,"round":"第三段","q":"佛有時說有我，有時說無我——到底哪一句是真的？","basis":"兩句話正好相反","keep":"兩句之中只能有一句是真","name":"皆是實，無相違背","tag":"四悉檀中，八萬四千法藏皆是實；放回各自的悉檀，句句皆實","gist":"四悉檀中，一切十二部經、八萬四千法藏，都是實，沒有互相違背。對以為人死如燈滅、行善作惡都沒有果報的人，佛說業報不失，讓他守住因果；對緊抓著一個常住自我不放的人，佛說無我，讓他鬆開執著。矛盾感，是因為把不同層次的話放在同一張桌上比較。","src":[{"lab":"原典・第三段","q":"四悉檀中，一切十二部經，八萬四千法藏，皆是實，無相違背。"}],"next":"既然句句皆實，用最高的第一義，是不是就能否定其他層次？"},{"id":"D7","seg":4,"round":"第四段","q":"既然一切皆空，因果也不必在乎了吧？","basis":"第一義說諸法實相","keep":"用第一義否定世間因果","name":"各以故實・不以空廢因果","tag":"不能用第一義去否定世界悉檀","gist":"關鍵在「故實」：因此而為實。一句教法真不真，要問它屬於哪一重悉檀、是對誰說、為了什麼說。所以不能用第一義去否定世界悉檀，說既然一切皆空，因果也不必在乎。","src":[{"lab":"原典・第四段","q":"佛法中，有以世界悉檀故實，有以各各為人悉檀故實，有以對治悉檀故實，有以第一義悉檀故實。"}],"next":"反過來，守住了世間因果，是不是就能說萬法各有自性？"},{"id":"D8","seg":4,"round":"第四段","q":"既然因果歷歷分明，萬法就各有自性吧？","basis":"善惡有報，絲毫不差","keep":"用世間因果否定第一義","name":"四重各實・彼此成全","tag":"也不能用世界悉檀去否定第一義；說空不破壞世間，守住世間也不執為實有","gist":"也不能用世界悉檀去否定第一義，說既然有因果，萬法就各有自性。四重各為其實，彼此成全：說空，不破壞世間；守住世間，也不把世間執為實有。","src":[{"lab":"原典・第四段","q":"有以第一義悉檀故實。"}],"next":""}],"W":[{"seg":1,"q":"佛欲說第一義悉檀相故","a":"佛陀為了闡明「第一義悉檀」（究竟真理）的義理","x":["佛 /* ───────── 工具 ───────── */
const $=s=>document.querySelector(s);

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const CN='零一二三四五六七八九十';

function parseHash(h){
  h=(h||'').replace(/^#/,'');
  let m=/^p(\d+)(?:-(\w+))?$/.exec(h), pin=PINS[0], k=null;

  if(k==='w1') choiceStage('w1');
  if(k==='f1') fillStage();
  if(k==='k1') choiceStage('k1');
  if(k==='m') matchStage();
}

/* ───────── 第一關：問題鏈排序 ───────── */
function orderStage(){
  const list=D.A;
  if(!S.sub) S.sub={pool:shuffle(list.map(x=>x.id)),seq:[],checked:false};
  const st=S.sub, byId=Object.fromEntries(list.map(x=>[x.id,x]));
  const head=`<div class="ptitle"><h2>${esc(D.o1t||'問題鏈排序')}・疑者${cn(list.length)}問</h2><p>${list.length} 張卡</p></div><p class="hint">${esc(D.o1h)}</p>`;
  if(!st.checked){
    const cards=st.pool.map(id=>{const p=st.seq.indexOf(id);return `<button class="ocard${p>=0?' sel':''}" data-id="${id}"><span class="n">${p>=0?p+1:''}</span><span class="t">${esc(byId[id].q)}</span></button>`;}).join('');
    $('#main').innerHTML=`<section class="panel">${head}<div class="olist">${cards}</div>
      <div class="bar"><span class="score">已排 ${st.seq.length} / ${list.length}　點已排的卡可退回</span>
      <span style="display:flex;gap:8px"><button class="btn ghost" id="reset">重排</button><button class="btn" id="check" ${st.seq.length<list.length?'disabled':''}>核對</button></span></div></section>`;
    document.querySelectorAll('.ocard').forEach(b=>b.onclick=()=>{
      const id=b.dataset.id,p=st.seq.indexOf(id);
      if(p>=0) st.seq=st.seq.slice(0,p); else st.seq.push(id);
      render();
    });
    $('#reset').onclick=()=>{st.seq=[];render();};
    $('#check').onclick=()=>{st.checked=true;render();};
    return;
  }
  const right=list.map(x=>x.id); let ok=0;
  const rows=right.map((id,i)=>{
    const good=st.seq[i]===id; if(good) ok++;
    const x=byId[id], s=D.SEG[x.seg];
    const yours=good?'':`<span class="score">（你排在第 ${st.seq.indexOf(id)+1} 位）</span>`;
    const link=i<right.length-1&&x.next?`<p class="link">↓ ${esc(x.next)}</p>`:'';
    return `<div class="ocard ${good?'good':'badpos'}"><span class="n">${i+1}</span><span class="t">${esc(x.q)} ${yours}<br><span class="score">${esc(s.lab)}・${esc(s.n)}　放不下：${esc(x.keep)}</span>　<a href="https://youtu.be/${D.vid}?t=${s.t}" target="_blank" rel="noopener">▶ ${mmss(s.t)}</a></span></div>${link}`;
  }).join('');
  saveBest('o1',`${ok}/${list.length}`);
  $('#main').innerHTML=`<section class="panel">${head}
    <div class="end"><p class="big">${ok} / ${list.length}</p><p class="hint">綠色是位置正確，紅色是排錯的位置。每兩張卡之間的金字，就是${esc(D.who)}「為什麼下一步這樣接」。</p></div>
    <div class="olist">${rows}</div>
    <div class="bar"><button class="btn ghost" id="again">再排一次</button><button class="btn" id="nextStage">下一關</button></div></section>`;
  $('#again').onclick=()=>{S.sub=null;render();};
  $('#nextStage').onclick=()=>go(S.stage+1);
  renderNav();
}

/* ───────── 第二關：疑者出招・你來接 ───────── */
function duelStage(){
  const list=D.A;
  if(!S.sub) S.sub={i:0,phase:'ask',score:0,opts:null,pick:null};
  const st=S.sub;
  if(st.i>=list.length) return duelEnd();
  const x=list[st.i];
  if(!st.opts) st.opts=shuffle([x.id,...shuffle(list.filter(y=>y.id!==x.id).map(y=>y.id)).slice(0,3)]);
  const byId=Object.fromEntries(list.map(y=>[y.id,y]));
  const prev=st.i>0?list[st.i-1].next:'';
  let html=`<section class="panel"><div class="ptitle"><h2>過招・${esc(D.short)}</h2><p>第 ${st.i+1} / ${list.length} 回合</p></div>
   ${prev?`<p class="retreat">${esc(prev)}</p>`:''}
   <div class="qrow"><div class="pill"><i>第${cn(st.i+1)}問</i><small>${esc(x.round)}</small></div><div class="qt"><p class="qbig">${esc(x.q)}</p><p class="qmeta">疑從哪來：<b>${esc(x.basis)}</b>｜放不下：<b>${esc(x.keep)}</b></p></div></div>
   <p class="hint">${esc(D.who)}用哪一招接住這個疑問？</p>
   <div class="opts">${st.opts.map(id=>{const o=byId[id];let c='';
     if(st.phase!=='ask'){ if(id===x.id) c='right'; else if(id===st.pick) c='wrong'; else c='dim'; }
     return `<button class="opt ${c}" data-id="${id}" ${st.phase!=='ask'?'disabled':''}><strong>${esc(o.name)}</strong><span>${esc(o.tag)}</span></button>`;}).join('')}</div>`;
  if(st.phase!=='ask'){
    const good=st.pick===x.id, w=byId[st.pick];
    html+=`<div class="fb ${good?'ok':'no'}"><h3>${good?'接得正著':'這一招接偏了'}</h3>
      ${good?'':`<p>「${esc(w.name)}」接的是另一個疑問：${esc(w.q)} 這一問，疑者放不下的是「${esc(x.keep)}」。正解是「${esc(x.name)}」。</p>`}
      <p><b>${esc(D.who)}怎麼接：</b>${esc(x.gist)}</p>${x.src.map(verseHTML).join('')}${vlink(x.seg,x.ch)}</div>
      <div class="bar"><span class="score">接對 ${st.score}</span><button class="btn" id="nx">${st.i===list.length-1?'看結果':'下一回合'}</button></div>`;
  } else {
    html+=`<div class="bar"><span class="score">接對 ${st.score}</span></div>`;
  }
  html+=`</section>`;
  $('#main').innerHTML=html;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{st.pick=b.dataset.id;if(st.pick===x.id)st.score++;st.phase='answered';render();});
  const nx=$('#nx'); if(nx) nx.onclick=()=>{st.i++;st.phase='ask';st.opts=null;st.pick=null;render();window.scrollTo({top:0,behavior:'smooth'});};
}
function duelEnd(){
  const st=S.sub,n=D.A.length;
  saveBest('d1',`${st.score}/${n}`);
  const nextPin=PINS.find(p=>p>D.pin);
  $('#main').innerHTML=`<section class="panel"><div class="ptitle"><h2>過招結束</h2></div>
   <div class="end"><p class="big">接對 ${st.score} / ${n}</p>
   <p class="hint">${esc(D.end1)}</p>
   <div class="road">${D.ROAD.map((r,i)=>`<span>${esc(r)}</span>${i<D.ROAD.length-1?'<i>→</i>':''}`).join('')}</div>
   <p class="hint">${esc(D.end2)}</p></div>
   <div class="bar">${nextPin?`<button class="btn ghost" id="nextPin">前往第${cn(nextPin)}品 →</button>`:'<span></span>'}<span style="display:flex;gap:8px"><button class="btn ghost" id="again">再打一輪</button><button class="btn" id="nextStage">下一關</button></span></div></section>`;
  $('#again').onclick=()=>{S.sub=null;render();};
  $('#nextStage').onclick=()=>go(S.stage+1);
  const np=$('#nextPin'); if(np) np.onclick=()=>{setPin(nextPin);S.stage=0;S.sub=null;try{history.replaceState(null,'',hashOf());}catch(e){}renderHead();renderNav();render();window.scrollTo({top:0,behavior:'smooth'});};
  renderNav();
}

/* ───────── 第三、五關：難句白話／關鍵提醒（四選一） ───────── */
function choiceStage(key){
  const isW=key==='w1', list=isW?D.W:D.K, N=Math.min(10,list.length);
  const title=isW?(D.w1t||'難句白話'):'關鍵提醒';
  if(!S.sub) S.sub={list:shuffle(list.map((_,i)=>i)).slice(0,N),i:0,score:0,pick:null,opts:null};
  const st=S.sub;
  if(st.i>=st.list.length){
    saveBest(key,`${st.score}/${st.list.length}`);
    $('#main').innerHTML=`<section class="panel"><div class="ptitle"><h2>${title}結束</h2></div><div class="end"><p class="big">${st.score} / ${st.list.length}</p><p class="hint">${list.length>N?`每輪從 ${list.length} 題中隨機抽 ${N} 題，多玩幾輪就能全部遇到。`:'每輪題序隨機。'}${isW?'正解都是讀本「白話翻譯表」的原句。':'中觀概念與說明都出自讀本「白話翻譯表」的中觀欄。'}</p></div>
      <div class="bar"><button class="btn ghost" id="again">再來一輪</button><button class="btn" id="nextStage">下一關</button></div></section>`;
    $('#again').onclick=()=>{S.sub=null;render();};$('#nextStage').onclick=()=>go(S.stage+1);renderNav();return;
  }
  const it=list[st.list[st.i]], s=D.SEG[it.seg];
  if(!st.opts) st.opts=shuffle([it.a,...(isW?it.x:it.o)]);
  let html=`<section class="panel"><div class="ptitle"><h2>${title}</h2><p>第 ${st.i+1} / ${st.list.length} 題</p></div>
    <p class="hint">${isW?'這一句原典，白話是哪一個？錯的選項都是常見的誤讀。':'這一句原典，指向哪一個中觀概念？'}</p>
    <div class="verse"><div class="lab">原典・${esc(s.lab)}・${esc(s.n)}</div><p class="quote">「${esc(it.q)}」</p></div>
    <div class="opts">${st.opts.map((o,j)=>{let c='';
      if(st.pick!=null){ if(o===it.a) c='right'; else if(o===st.pick) c='wrong'; else c='dim'; }
      return isW?`<button class="opt plain ${c}" data-j="${j}" ${st.pick!=null?'disabled':''}>${esc(o)}</button>`
               :`<button class="opt ${c}" data-j="${j}" ${st.pick!=null?'disabled':''}><strong>${esc(o)}</strong></button>`;}).join('')}</div>`;
  if(st.pick!=null){
    const good=st.pick===it.a;
    html+=`<div class="fb ${good?'ok':'no'}"><h3>${good?'對了':'不是這個意思'}</h3>
      ${isW?`<p><b>讀本白話：</b>${esc(it.a)}</p>`:`<p><b>${esc(it.a)}</b>——${esc(it.d)}</p>`}${vlink(it.seg)}</div>
      <div class="bar"><span class="score">答對 ${st.score}</span><button class="btn" id="nx">${st.i===st.list.length-1?'看結果':'下一題'}</button></div>`;
  } else html+=`<div class="bar"><span class="score">答對 ${st.score}</span></div>`;
  html+=`</section>`;
  $('#main').innerHTML=html;
  document.querySelectorAll('.opt[data-j]').forEach(b=>b.onclick=()=>{st.pick=st.opts[+b.dataset.j];if(st.pick===it.a)st.score++;render();});
  const nx=$('#nx'); if(nx) nx.onclick=()=>{st.i++;st.pick=null;st.opts=null;render();window.scrollTo({top:0,behavior:'smooth'});};
}

/* ───────── 第四關：原文填空 ───────── */
function fillStage(){
  const F=D.F, N=Math.min(10,F.length);
  if(!S.sub) S.sub={list:shuffle(F.map((_,i)=>i)).slice(0,N),i:0,score:0,pick:null,opts:null};
  const st=S.sub;
  if(st.i>=st.list.length){
    saveBest('f1',`${st.score}/${st.list.length}`);
    $('#main').innerHTML=`<section class="panel"><div class="ptitle"><h2>原文填空結束</h2></div><div class="end"><p class="big">${st.score} / ${st.list.length}</p><p class="hint">${F.length>N?`每輪從 ${F.length} 句中隨機抽 ${N} 句，多玩幾輪就能全部遇到。`:'每輪題序隨機。'}</p></div>
      <div class="bar"><button class="btn ghost" id="again">再來一輪</button><button class="btn" id="nextStage">下一關</button></div></section>`;
    $('#again').onclick=()=>{S.sub=null;render();};$('#nextStage').onclick=()=>go(S.stage+1);renderNav();return;
  }
  const f=F[st.list[st.i]], s=D.SEG[f.seg];
  if(!st.opts) st.opts=shuffle(f.opts);
  const lines=f.v.map((l,j)=>{
    if(j!==f.ln) return `<p class="ln">${esc(l)}</p>`;
    const p=l.indexOf(f.ans);
    const fill=st.pick?`<span class="blank filled">${esc(f.ans)}</span>`:`<span class="blank">　</span>`;
    return `<p class="ln">${esc(l.slice(0,p))}${fill}${esc(l.slice(p+f.ans.length))}</p>`;
  }).join('');
  let html=`<section class="panel"><div class="ptitle"><h2>原文填空</h2><p>第 ${st.i+1} / ${st.list.length} 句</p></div>
    <p class="hint">選出空格裡的字。原典一字不改，填的是鳩摩羅什譯本的原文。</p>
    <div class="verse"><div class="lab">原典・${esc(s.lab)}・${esc(s.n)}</div>${lines}</div>
    <div class="chips">${st.opts.map(o=>{let c='';if(st.pick){if(o===f.ans)c='right';else if(o===st.pick)c='wrong';}
      return `<button class="chip ${c}" data-o="${esc(o)}" ${st.pick?'disabled':''}>${esc(o)}</button>`;}).join('')}</div>`;
  if(st.pick){
    const good=st.pick===f.ans;
    html+=`<div class="fb ${good?'ok':'no'}"><h3>${good?'對了':'不是「'+esc(st.pick)+'」'}</h3><p>這一句在本品的位置：<b>${esc(f.note)}</b>。</p>${vlink(f.seg)}</div>
      <div class="bar"><span class="score">答對 ${st.score}</span><button class="btn" id="nx">${st.i===st.list.length-1?'看結果':'下一句'}</button></div>`;
  } else html+=`<div class="bar"><span class="score">答對 ${st.score}</span></div>`;
  html+=`</section>`;
  $('#main').innerHTML=html;
  document.querySelectorAll('.chip[data-o]').forEach(b=>b.onclick=()=>{st.pick=b.dataset.o;if(st.pick===f.ans)st.score++;render();});
  const nx=$('#nx'); if(nx) nx.onclick=()=>{st.i++;st.pick=null;st.opts=null;render();};
}

/* ───────── 第六關：配對快打 ───────── */
let timer=null;
function matchStage(){
  const K6=Math.min(6,D.A.length);
  if(!S.sub){
    const pool=shuffle(D.A).slice(0,K6);
    S.sub={pairs:pool,left:shuffle(pool.map(x=>x.id)),right:shuffle(pool.map(x=>x.id)),done:[],pickL:null,miss:0,t0:null,t:0,bad:null};
  }
  const st=S.sub, byId=Object.fromEntries(st.pairs.map(x=>[x.id,x])), n=st.pairs.length;
  const finished=st.done.length===n;
  if(finished&&timer){clearInterval(timer);timer=null;saveBest('m',+st.t.toFixed(1),true);}
  let html=`<section class="panel"><div class="ptitle"><h2>配對快打</h2><p>每輪${cn(n)}組，計時</p></div>
   <p class="hint">先點左邊「疑者放不下的」，再點右邊${esc(D.who)}接住它的那一招。配錯會記一次失手。</p>
   <div class="bar"><span class="score" id="clock">用時 ${st.t.toFixed(1)} 秒｜失手 ${st.miss}｜已配 ${st.done.length} / ${n}</span>${S.best.m!=null?`<span class="score">最佳 ${S.best.m} 秒</span>`:''}</div>
   <div class="mgrid"><div class="mcol"><h4>疑者放不下</h4>${st.left.map(id=>{const x=byId[id];
      const c=st.done.includes(id)?'done':(st.pickL===id?'pick':'');
      return `<button class="mi ${c}" data-l="${id}" ${st.done.includes(id)?'disabled':''}><span class="src">${esc(x.round)}</span>${esc(x.keep)}</button>`;}).join('')}</div>
   <div class="mcol"><h4>${esc(D.who)}的招</h4>${st.right.map(id=>{const x=byId[id];
      const c=st.done.includes(id)?'done':(st.bad===id?'shake':'');
      return `<button class="mi ${c}" data-r="${id}" ${st.done.includes(id)?'disabled':''}>${esc(x.name)}</button>`;}).join('')}</div></div>`;
  if(finished) html+=`<div class="end"><p class="big">${st.t.toFixed(1)} 秒・失手 ${st.miss}</p><p class="hint">${cn(n)}組全配上了。再來一輪會換一批題。</p><div class="bar" style="width:100%"><button class="btn" id="again">再來一輪</button><button class="btn ghost" id="first">回第一關</button></div></div>`;
  html+=`</section>`;
  $('#main').innerHTML=html;
  document.querySelectorAll('.mi[data-l]').forEach(b=>b.onclick=()=>{
    if(!st.t0){st.t0=performance.now();timer=setInterval(()=>{st.t=(performance.now()-st.t0)/1000;const c=$('#clock');if(c)c.textContent=`用時 ${st.t.toFixed(1)} 秒｜失手 ${st.miss}｜已配 ${st.done.length} / ${n}`;},100);}
    st.pickL=b.dataset.l;st.bad=null;render();
  });
  document.querySelectorAll('.mi[data-r]').forEach(b=>b.onclick=()=>{
    if(!st.pickL) return;
    if(b.dataset.r===st.pickL){st.done.push(st.pickL);st.pickL=null;st.bad=null;}
    else{st.miss++;st.bad=b.dataset.r;}
    render();
  });
  const ag=$('#again'); if(ag) ag.onclick=()=>{S.sub=null;st.t=0;render();};
  const fs=$('#first'); if(fs) fs.onclick=()=>go(0);
  renderNav();
}

/* ───────── 開場 ───────── */
function applyHash(){
  const r=parseHash(location.hash);
  setPin(r.pin);
  const hi=r.k?stages().findIndex(s=>s.k===r.k):-1;
  S.stage=hi>=0?hi:0; S.sub=null;
}
function start(d){
  applyHash();
  if(d&&typeof d.pin==='number'&&P[d.pin]){setPin(d.pin);}
  if(d&&typeof d.stage==='number'){S.stage=d.stage;S.sub=d.sub||null;}
  renderHead();renderNav();render();
}
window.addEventListener('hashchange',()=>{const r=parseHash(location.hash);const hi=r.k?stages().findIndex(s=>s.k===r.k):0;if(r.pin===D.pin&&hi===S.stage)return;applyHash();renderHead();renderNav();render();});
window.claude?.hot?.snapshot?.(()=>({pin:D.pin,stage:S.stage,sub:S.stage===5?null:S.sub}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
