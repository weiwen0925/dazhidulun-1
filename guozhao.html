 {seg:1,q:'萬有陳於外、悔吝生於內者，其唯邪思乎！',a:'破戲論／顛倒',d:'妄想分別（戲論）是生死根，正是中觀所破。',o:['二諦並用','般若為鏡','假名施設']},
 {seg:2,q:'阿含為之作……般若為之照',a:'二諦並用',d:'阿含（世俗諦·對治）、般若（勝義諦·照空），依二諦而說法。',o:['中道·無所執','破戲論／顛倒','隨機方便']},
 {seg:2,q:'理超文表，趣絕思境。以言求之，則乖其深',a:'實相離言',d:'實相離四句、絕百非，非言智可及。',o:['般若光明','二諦並用','善巧方便']},
 {seg:2,q:'二乘所以顛沛於三藏，雜學所以曝鱗於龍門者',a:'不達畢竟空之失',d:'二乘、雜學顛沛曝鱗，皆因滯於有見、未證空義。',o:['般若光明','隨機方便','般若為鏡']},
 {seg:3,q:'寄跡凡夫示悟物以漸',a:'善巧方便',d:'「寄跡凡夫、假照龍宮」，以方便漸引眾生而成《釋論》。',o:['諸法實相','般若正觀','不生（無生）']},
 {seg:3,q:'其辯實相也，則使妄見之惑不遠而自復',a:'諸法實相',d:'顯中道實相，虛妄見自正。',o:['善巧方便','不達畢竟空之失','般若為鏡']},
 {seg:4,q:'必標眾異以盡美……則舉無執以盡善',a:'中道·無所執',d:'「標眾異盡美、舉無執盡善、折中定之」：不落兩邊的中道論法。',o:['二諦並用','破邪顯正','般若光明']},
 {seg:5,q:'常杖茲論為淵鏡憑高、致以明宗',a:'般若為鏡',d:'以般若正觀為準繩明宗。',o:['破戲論／顛倒','隨機方便','不生（無生）']},
 {seg:5,q:'相與弘兼忘之慧',a:'能所兼忘·無所得',d:'能觀所觀雙泯，即無所得般若。',o:['破邪顯正','假名施設','善巧方便']},
 {seg:6,q:'三分除二，得此百卷',a:'假名施設',d:'文字乃假名，隨宜刪略而不壞其義。',o:['般若光明','實相離言','不生（無生）']},
 {seg:6,q:'歸途直達，無復惑趣之疑',a:'般若正觀',d:'依正觀直趣實相、不迷歧途。',o:['破戲論／顛倒','隨機方便','不達畢竟空之失']},
 {seg:7,q:'智慧日已頹，斯人令再曜',a:'般若光明',d:'般若如日，照破無明昏寢。',o:['假名施設','二諦並用','中道·無所執']},
 {seg:7,q:'虛言與實教並興，嶮徑與夷路爭轍',a:'破邪顯正',d:'「邪法盛、虛實並興、嶮夷爭轍」，非二匠不能正之。',o:['假名施設','能所兼忘·無所得','不生（無生）']},
 {seg:8,q:'法師以秦人好簡故，裁而略之',a:'隨機方便',d:'應機刪略，方便攝化。',o:['諸法實相','般若光明','實相離言']},
 {seg:8,q:'略其文而挹其玄',a:'依義不依語',d:'「唯案譯而書、略文挹玄」：不執文字，取其玄旨。',o:['二諦並用','般若光明','破邪顯正']}
];

/* ───────── 工具 ───────── */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const CN='零一二三四五六七八九十';
const cn=n=>n<=10?CN[n]:(n<20?'十'+CN[n-10]:CN[Math.floor(n/10)]+'十'+(n%10?CN[n%10]:''));
const mmss=t=>Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
const store={get(k,d){try{const v=localStorage.getItem('dzgz1:'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('dzgz1:'+k,JSON.stringify(v));}catch(e){}}};
function verseHTML(s){
  if(s.v) return `<div class="verse"><div class="lab">${esc(s.lab)}</div>${s.v.map(l=>`<p class="ln">${esc(l)}</p>`).join('')}</div>`;
  return `<div class="verse"><div class="lab">${esc(s.lab)}</div><p class="quote">「${esc(s.q)}」</p></div>`;
}
function vlink(seg,ch){
  const s=SEG[seg], c=ch||s.ch;
  return `<p class="vlink"><a href="https://youtu.be/${VID}?t=${s.t}" target="_blank" rel="noopener">▶ 回看影片・第${cn(seg)}段 ${mmss(s.t)}</a><a href="${READ}-${c}" target="_blank" rel="noopener">讀本・第${cn(c)}章 →</a></p>`;
}
const STAGES=[
 {k:'o1',t:'序脈排序',d:'排出九個疑問'},
 {k:'d1',t:'過招',d:'疑者出招，你接'},
 {k:'w1',t:'難句白話',d:'典故一句句拆'},
 {k:'f1',t:'原文填空',d:'序文名句'},
 {k:'k1',t:'關鍵提醒',d:'原典↔中觀'},
 {k:'m',t:'配對快打',d:'疑問↔答招'}
];
let S={stage:0,best:store.get('best',{}),sub:null};

function renderNav(){
  $('#stages').innerHTML=STAGES.map((s,i)=>{
    const b=S.best[s.k];
    const mark=b==null?'':(s.k==='m'?`最佳 ${b} 秒`:`最佳 ${b}`);
    return `<button class="stg" data-i="${i}" aria-current="${i===S.stage}"><b>第${cn(i+1)}關</b><span>${s.t}</span><em>${mark||s.d}</em></button>`;
  }).join('');
  document.querySelectorAll('.stg').forEach(b=>b.onclick=()=>go(+b.dataset.i));
}
function go(i){S.stage=i;S.sub=null;try{history.replaceState(null,'','#'+STAGES[i].k);}catch(e){}renderNav();render();window.scrollTo({top:0,behavior:'smooth'});}
function saveBest(k,v,lowerBetter){
  const o=S.best[k];
  if(o==null||(lowerBetter?v<o:(+String(v).split('/')[0])>(+String(o).split('/')[0]))){S.best[k]=v;store.set('best',S.best);}
}
function render(){
  const k=STAGES[S.stage].k;
  if(k==='o1') orderStage();
  if(k==='d1') duelStage();
  if(k==='w1') choiceStage('w1');
  if(k==='f1') fillStage();
  if(k==='k1') choiceStage('k1');
  if(k==='m') matchStage();
}

/* ───────── 第一關：序脈排序 ───────── */
function orderStage(){
  const list=A;
  if(!S.sub) S.sub={pool:shuffle(list.map(x=>x.id)),seq:[],checked:false};
  const st=S.sub, byId=Object.fromEntries(list.map(x=>[x.id,x]));
  const head=`<div class="ptitle"><h2>序脈・疑者九問</h2><p>${list.length} 張卡</p></div><p class="hint">僧叡的序文，一段接一段回答讀者心裡的疑問：前一段的答案，引出下一段的問題。依序文先後點選排序。</p>`;
  if(!st.checked){
    const cards=st.pool.map(id=>{const p=st.seq.indexOf(id);return `<button class="ocard${p>=0?' sel':''}" data-id="${id}"><span class="n">${p>=0?p+1:''}</span><span class="t">${esc(byId[id].q)}</span></button>`;}).join('');
    $('#main').innerHTML=`<section class="panel">${head}<div class="olist">${cards}</div>
      <div class="bar"><span class="score">已排 ${st.seq.length} / ${list.length}　點已排的卡可退回</span>
      <span style="display:flex;gap:8px"><button class="btn ghost" id="reset">重排</button><button class="btn" id="check" ${st.seq.length<list.length?'disabled':''}>核對</button></span></div></section>`;
    document.querySelectorAll('.ocard').forEach(b=>b.onclick=()=>{
      const id=b.dataset.id,p=st.seq.indexOf(id);
      if(p>=0) st.seq=st.seq.slice(0,p); else st.seq.push(id);
      render();
    });
    $('#reset').onclick=()=>{st.seq=[];render();};
    $('#check').onclick=()=>{st.checked=true;render();};
    return;
  }
  const right=list.map(x=>x.id); let ok=0;
  const rows=right.map((id,i)=>{
    const good=st.seq[i]===id; if(good) ok++;
    const x=byId[id], s=SEG[x.seg];
    const yours=good?'':`<span class="score">（你排在第 ${st.seq.indexOf(id)+1} 位）</span>`;
    const link=i<right.length-1&&x.next?`<p class="link">↓ ${esc(x.next)}</p>`:'';
    return `<div class="ocard ${good?'good':'badpos'}"><span class="n">${i+1}</span><span class="t">${esc(x.q)} ${yours}<br><span class="score">${esc(x.round)}・${esc(s.n)}　放不下：${esc(x.keep)}</span>　<a href="https://youtu.be/${VID}?t=${s.t}" target="_blank" rel="noopener">▶ ${mmss(s.t)}</a></span></div>${link}`;
  }).join('');
  saveBest('o1',`${ok}/${list.length}`);
  $('#main').innerHTML=`<section class="panel">${head}
    <div class="end"><p class="big">${ok} / ${list.length}</p><p class="hint">綠色是位置正確，紅色是排錯的位置。每兩張卡之間的金字，就是序文「為什麼下一段這樣接」。</p></div>
    <div class="olist">${rows}</div>
    <div class="bar"><button class="btn ghost" id="again">再排一次</button><button class="btn" id="nextStage">下一關</button></div></section>`;
  $('#again').onclick=()=>{S.sub=null;render();};
  $('#nextStage').onclick=()=>go(S.stage+1);
  renderNav();
}

/* ───────── 第二關：疑者出招・你替僧叡接 ───────── */
function duelStage(){
  const list=A;
  if(!S.sub) S.sub={i:0,phase:'ask',score:0,opts:null,pick:null};
  const st=S.sub;
  if(st.i>=list.length) return duelEnd();
  const x=list[st.i];
  if(!st.opts) st.opts=shuffle([x.id,...shuffle(list.filter(y=>y.id!==x.id).map(y=>y.id)).slice(0,3)]);
  const byId=Object.fromEntries(list.map(y=>[y.id,y]));
  const prev=st.i>0?list[st.i-1].next:'';
  let html=`<section class="panel"><div class="ptitle"><h2>過招・僧叡釋論序</h2><p>第 ${st.i+1} / ${list.length} 回合</p></div>
   ${prev?`<p class="retreat">${esc(prev)}</p>`:''}
   <div class="qrow"><div class="pill"><i>第${cn(st.i+1)}問</i><small>${esc(x.round)}</small></div><div class="qt"><p class="qbig">${esc(x.q)}</p><p class="qmeta">疑從哪來：<b>${esc(x.basis)}</b>｜放不下：<b>${esc(x.keep)}</b></p></div></div>
   <p class="hint">序文用哪一招接住這個疑問？</p>
   <div class="opts">${st.opts.map(id=>{const o=byId[id];let c='';
     if(st.phase!=='ask'){ if(id===x.id) c='right'; else if(id===st.pick) c='wrong'; else c='dim'; }
     return `<button class="opt ${c}" data-id="${id}" ${st.phase!=='ask'?'disabled':''}><strong>${esc(o.name)}</strong><span>${esc(o.tag)}</span></button>`;}).join('')}</div>`;
  if(st.phase!=='ask'){
    const good=st.pick===x.id, w=byId[st.pick];
    html+=`<div class="fb ${good?'ok':'no'}"><h3>${good?'接得正著':'這一招接偏了'}</h3>
      ${good?'':`<p>「${esc(w.name)}」接的是另一個疑問：${esc(w.q)} 這一問，疑者放不下的是「${esc(x.keep)}」。正解是「${esc(x.name)}」。</p>`}
      <p><b>序文怎麼接：</b>${esc(x.gist)}</p>${x.src.map(verseHTML).join('')}${vlink(x.seg,x.ch)}</div>
      <div class="bar"><span class="score">接對 ${st.score}</span><button class="btn" id="nx">${st.i===list.length-1?'看結果':'下一回合'}</button></div>`;
  } else {
    html+=`<div class="bar"><span class="score">接對 ${st.score}</span></div>`;
  }
  html+=`</section>`;
  $('#main').innerHTML=html;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{st.pick=b.dataset.id;if(st.pick===x.id)st.score++;st.phase='answered';render();});
  const nx=$('#nx'); if(nx) nx.onclick=()=>{st.i++;st.phase='ask';st.opts=null;st.pick=null;render();window.scrollTo({top:0,behavior:'smooth'});};
}
function duelEnd(){
  const st=S.sub,n=A.length;
  saveBest('d1',`${st.score}/${n}`);
  $('#main').innerHTML=`<section class="panel"><div class="ptitle"><h2>過招結束</h2></div>
   <div class="end"><p class="big">接對 ${st.score} / ${n}</p>
   <p class="hint">九個疑問一路走完：從萬有的無生，走到手上這部譯本。下面是序文八段走成的路。</p>
   <div class="road">${ROAD.map((r,i)=>`<span>${esc(r)}</span>${i<ROAD.length-1?'<i>→</i>':''}`).join('')}</div>
   <p class="hint">請帶走頭尾兩句：「無生、無始，物之性也」；「略其文而挹其玄」。</p></div>
   <div class="bar"><button class="btn ghost" id="again">再打一輪</button><button class="btn" id="nextStage">下一關</button></div></section>`;
  $('#again').onclick=()=>{S.sub=null;render();};
  $('#nextStage').onclick=()=>go(S.stage+1);
  renderNav();
}

/* ───────── 第三、五關：難句白話／關鍵提醒（四選一） ───────── */
function choiceStage(key){
  const isW=key==='w1', list=isW?W:K, N=10;
  const title=isW?'難句白話':'關鍵提醒';
  if(!S.sub) S.sub={list:shuffle(list.map((_,i)=>i)).slice(0,N),i:0,score:0,pick:null,opts:null};
  const st=S.sub;
  if(st.i>=st.list.length){
    saveBest(key,`${st.score}/${st.list.length}`);
    $('#main').innerHTML=`<section class="panel"><div class="ptitle"><h2>${title}結束</h2></div><div class="end"><p class="big">${st.score} / ${st.list.length}</p><p class="hint">每輪從 ${list.length} 題中隨機抽 ${N} 題，多玩幾輪就能全部遇到。${isW?'正解都是讀本「白話翻譯表」的原句。':'中觀概念與說明都出自讀本「白話翻譯表」的中觀欄，也是影片裡每段的關鍵提醒。'}</p></div>
      <div class="bar"><button class="btn ghost" id="again">再來一輪</button><button class="btn" id="nextStage">下一關</button></div></section>`;
    $('#again').onclick=()=>{S.sub=null;render();};$('#nextStage').onclick=()=>go(S.stage+1);renderNav();return;
  }
  const it=list[st.list[st.i]];
  if(!st.opts) st.opts=shuffle([it.a,...(isW?it.x:it.o)]);
  let html=`<section class="panel"><div class="ptitle"><h2>${title}</h2><p>第 ${st.i+1} / ${st.list.length} 題</p></div>
    <p class="hint">${isW?'這一句原典，白話是哪一個？錯的選項都是常見的誤讀。':'這一句原典，指向哪一個中觀概念？'}</p>
    <div class="verse"><div class="lab">原典・第${cn(it.seg)}段・${esc(SEG[it.seg].n)}</div><p class="quote">「${esc(it.q)}」</p></div>
    <div class="opts">${st.opts.map((o,j)=>{let c='';
      if(st.pick!=null){ if(o===it.a) c='right'; else if(o===st.pick) c='wrong'; else c='dim'; }
      return isW?`<button class="opt plain ${c}" data-j="${j}" ${st.pick!=null?'disabled':''}>${esc(o)}</button>`
               :`<button class="opt ${c}" data-j="${j}" ${st.pick!=null?'disabled':''}><strong>${esc(o)}</strong></button>`;}).join('')}</div>`;
  if(st.pick!=null){
    const good=st.pick===it.a;
    html+=`<div class="fb ${good?'ok':'no'}"><h3>${good?'對了':'不是這個意思'}</h3>
      ${isW?`<p><b>讀本白話：</b>${esc(it.a)}</p>`:`<p><b>${esc(it.a)}</b>——${esc(it.d)}</p>`}${vlink(it.seg)}</div>
      <div class="bar"><span class="score">答對 ${st.score}</span><button class="btn" id="nx">${st.i===st.list.length-1?'看結果':'下一題'}</button></div>`;
  } else html+=`<div class="bar"><span class="score">答對 ${st.score}</span></div>`;
  html+=`</section>`;
  $('#main').innerHTML=html;
  document.querySelectorAll('.opt[data-j]').forEach(b=>b.onclick=()=>{st.pick=st.opts[+b.dataset.j];if(st.pick===it.a)st.score++;render();});
  const nx=$('#nx'); if(nx) nx.onclick=()=>{st.i++;st.pick=null;st.opts=null;render();window.scrollTo({top:0,behavior:'smooth'});};
}

/* ───────── 第四關：原文填空 ───────── */
function fillStage(){
  if(!S.sub) S.sub={list:shuffle(F.map((_,i)=>i)).slice(0,10),i:0,score:0,pick:null,opts:null};
  const st=S.sub;
  if(st.i>=st.list.length){
    saveBest('f1',`${st.score}/${st.list.length}`);
    $('#main').innerHTML=`<section class="panel"><div class="ptitle"><h2>原文填空結束</h2></div><div class="end"><p class="big">${st.score} / ${st.list.length}</p><p class="hint">每輪從 ${F.length} 句中隨機抽十句，多玩幾輪就能全部遇到。</p></div>
      <div class="bar"><button class="btn ghost" id="again">再來一輪</button><button class="btn" id="nextStage">下一關</button></div></section>`;
    $('#again').onclick=()=>{S.sub=null;render();};$('#nextStage').onclick=()=>go(S.stage+1);renderNav();return;
  }
  const f=F[st.list[st.i]];
  if(!st.opts) st.opts=shuffle(f.opts);
  const lines=f.v.map((l,j)=>{
    if(j!==f.ln) return `<p class="ln">${esc(l)}</p>`;
    const p=l.indexOf(f.ans);
    const fill=st.pick?`<span class="blank filled">${esc(f.ans)}</span>`:`<span class="blank">　</span>`;
    return `<p class="ln">${esc(l.slice(0,p))}${fill}${esc(l.slice(p+f.ans.length))}</p>`;
  }).join('');
  let html=`<section class="panel"><div class="ptitle"><h2>原文填空</h2><p>第 ${st.i+1} / ${st.list.length} 句</p></div>
    <p class="hint">選出空格裡的字。原典一字不改，填的是僧叡序文的原文。</p>
    <div class="verse"><div class="lab">原典・第${cn(f.seg)}段・${esc(SEG[f.seg].n)}</div>${lines}</div>
    <div class="chips">${st.opts.map(o=>{let c='';if(st.pick){if(o===f.ans)c='right';else if(o===st.pick)c='wrong';}
      return `<button class="chip ${c}" data-o="${esc(o)}" ${st.pick?'disabled':''}>${esc(o)}</button>`;}).join('')}</div>`;
  if(st.pick){
    const good=st.pick===f.ans;
    html+=`<div class="fb ${good?'ok':'no'}"><h3>${good?'對了':'不是「'+esc(st.pick)+'」'}</h3><p>這一句在序文裡的位置：<b>${esc(f.note)}</b>。</p>${vlink(f.seg)}</div>
      <div class="bar"><span class="score">答對 ${st.score}</span><button class="btn" id="nx">${st.i===st.list.length-1?'看結果':'下一句'}</button></div>`;
  } else html+=`<div class="bar"><span class="score">答對 ${st.score}</span></div>`;
  html+=`</section>`;
  $('#main').innerHTML=html;
  document.querySelectorAll('.chip[data-o]').forEach(b=>b.onclick=()=>{st.pick=b.dataset.o;if(st.pick===f.ans)st.score++;render();});
  const nx=$('#nx'); if(nx) nx.onclick=()=>{st.i++;st.pick=null;st.opts=null;render();};
}

/* ───────── 第六關：配對快打 ───────── */
let timer=null;
function matchStage(){
  if(!S.sub){
    const pool=shuffle(A).slice(0,6);
    S.sub={pairs:pool,left:shuffle(pool.map(x=>x.id)),right:shuffle(pool.map(x=>x.id)),done:[],pickL:null,miss:0,t0:null,t:0,bad:null};
  }
  const st=S.sub, byId=Object.fromEntries(st.pairs.map(x=>[x.id,x]));
  const finished=st.done.length===st.pairs.length;
  if(finished&&timer){clearInterval(timer);timer=null;saveBest('m',+st.t.toFixed(1),true);}
  let html=`<section class="panel"><div class="ptitle"><h2>配對快打</h2><p>每輪六組，計時</p></div>
   <p class="hint">先點左邊「疑者放不下的」，再點右邊序文接住它的那一招。配錯會記一次失手。</p>
   <div class="bar"><span class="score" id="clock">用時 ${st.t.toFixed(1)} 秒｜失手 ${st.miss}｜已配 ${st.done.length} / 6</span>${S.best.m!=null?`<span class="score">最佳 ${S.best.m} 秒</span>`:''}</div>
   <div class="mgrid"><div class="mcol"><h4>疑者放不下</h4>${st.left.map(id=>{const x=byId[id];
      const c=st.done.includes(id)?'done':(st.pickL===id?'pick':'');
      return `<button class="mi ${c}" data-l="${id}" ${st.done.includes(id)?'disabled':''}><span class="src">${esc(x.round)}</span>${esc(x.keep)}</button>`;}).join('')}</div>
   <div class="mcol"><h4>序文的招</h4>${st.right.map(id=>{const x=byId[id];
      const c=st.done.includes(id)?'done':(st.bad===id?'shake':'');
      return `<button class="mi ${c}" data-r="${id}" ${st.done.includes(id)?'disabled':''}>${esc(x.name)}</button>`;}).join('')}</div></div>`;
  if(finished) html+=`<div class="end"><p class="big">${st.t.toFixed(1)} 秒・失手 ${st.miss}</p><p class="hint">六組全配上了。再來一輪會換一批題。</p><div class="bar" style="width:100%"><button class="btn" id="again">再來一輪</button><button class="btn ghost" id="first">回第一關</button></div></div>`;
  html+=`</section>`;
  $('#main').innerHTML=html;
  document.querySelectorAll('.mi[data-l]').forEach(b=>b.onclick=()=>{
    if(!st.t0){st.t0=performance.now();timer=setInterval(()=>{st.t=(performance.now()-st.t0)/1000;const c=$('#clock');if(c)c.textContent=`用時 ${st.t.toFixed(1)} 秒｜失手 ${st.miss}｜已配 ${st.done.length} / 6`;},100);}
    st.pickL=b.dataset.l;st.bad=null;render();
  });
  document.querySelectorAll('.mi[data-r]').forEach(b=>b.onclick=()=>{
    if(!st.pickL) return;
    if(b.dataset.r===st.pickL){st.done.push(st.pickL);st.pickL=null;st.bad=null;}
    else{st.miss++;st.bad=b.dataset.r;}
    render();
  });
  const ag=$('#again'); if(ag) ag.onclick=()=>{S.sub=null;render();};
  const fs=$('#first'); if(fs) fs.onclick=()=>go(0);
  renderNav();
}

/* ───────── 開場 ───────── */
function start(d){
  const h=(location.hash||'').slice(1), hi=STAGES.findIndex(s=>s.k===h);
  if(hi>=0) S.stage=hi;
  if(d&&typeof d.stage==='number'){S.stage=d.stage;S.sub=d.sub||null;}
  renderNav();render();
}
window.addEventListener('hashchange',()=>{const hi=STAGES.findIndex(s=>s.k===(location.hash||'').slice(1));if(hi>=0&&hi!==S.stage)go(hi);});
window.claude?.hot?.snapshot?.(()=>({stage:S.stage,sub:S.stage===5?null:S.sub}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
